core:changelogs:
  - content: "---\npackages:\n  \"@monke-together-strong/oxc-config\":\n    type: patch\n---\n\n### Allow two-handler `.then(ok, err)`\n\nDisable `promise/prefer-catch`. `.then(ok, err)` and `.then(ok).catch(err)` are not equivalent: the `.catch` also receives failures thrown by `ok`, so the rule pushed deliberate two-handler code toward a behavior change. Oxlint offers no fix for the two-handler form for that reason. Replace `oxlint-disable` comments for `promise/prefer-catch` with plain comments when you upgrade.\n"
    filename: 2026-11-19-promise-prefer-catch.md
    v: 0.0.0
