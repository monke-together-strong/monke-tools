name: Verify Mainline

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Check Mainline
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Mainline
        uses: ./.github/actions/setup-mainline

      - name: Check
        # PR CI owns the full unit suite; see docs/adr/0009-distribute-monke-tools-as-atomic-release-bundles.md.
        run: vp check

      - name: Check packaged skill links
        run: vpr skills:check-links
