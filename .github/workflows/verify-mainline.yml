name: Verify Mainline

on:
  workflow_call:
    inputs:
      select-release:
        description: Check whether the push qualifies for a Mainline release and compute the version if it does
        type: boolean
        default: false
    outputs:
      relevant:
        value: ${{ jobs.verify.outputs.relevant }}
      version:
        value: ${{ jobs.verify.outputs.version }}

permissions:
  contents: read

jobs:
  verify:
    name: Check Mainline
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.release.outputs.relevant }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          # Release selection needs history and tags. GitHub Actions treats numeric 0 as false.
          fetch-depth: ${{ inputs.select-release && '0' || '1' }}
          persist-credentials: false

      - name: Setup Mainline
        uses: ./.github/actions/setup-mainline

      - name: Restore imported guidance cache
        # Restore trusts matching guidance and its marker, so use this cache only on pushes to main.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: guidance-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: |
            skills/.monke-restored.json
            skills/imported
            skills/references/imported
          key: monke-tools-guidance-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('monke.yml', 'bun.lock', 'package.json', 'src/**', 'scripts/**') }}

      - name: Restore locked guidance
        run: bun run src/index.ts skills restore --repo

      - name: Check
        # PR CI owns the full unit suite; see docs/adr/0009-distribute-monke-tools-as-atomic-release-bundles.md.
        run: vp check

      - name: Check packaged skill links
        run: vpr skills:check-links

      - name: Select Mainline release
        id: release
        if: inputs.select-release
        env:
          AFTER_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE_SHA" ] ||
            [ "$BEFORE_SHA" = 0000000000000000000000000000000000000000 ] ||
            ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            relevant=true
          else
            relevant="$(bun run scripts/release-bundle.ts relevant \
              --before "$BEFORE_SHA" \
              --after "$AFTER_SHA")"
          fi
          printf 'relevant=%s\n' "$relevant" >> "$GITHUB_OUTPUT"
          if [ "$relevant" != true ]; then
            exit 0
          fi

          version="$(bun run scripts/release-bundle.ts next-version)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Save imported guidance cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.guidance-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: |
            skills/.monke-restored.json
            skills/imported
            skills/references/imported
          key: monke-tools-guidance-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('monke.yml', 'bun.lock', 'package.json', 'src/**', 'scripts/**') }}
