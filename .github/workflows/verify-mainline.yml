name: Verify Mainline

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Check Mainline
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Mainline
        uses: ./.github/actions/setup-mainline

      - name: Check
        # Issue #130 keeps the full unit suite in PR CI and deliberately avoids repeating it here.
        run: vp check
