name: Qualify Mainline Bun Cache

on:
  push:
    branches: [feature/measure-bun-package-cache-20261118]

permissions:
  contents: read

jobs:
  cold:
    if: >-
      github.repository == 'monke-together-strong/monke-tools' &&
      github.ref == 'refs/heads/feature/measure-bun-package-cache-20261118'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5
        with:
          persist-credentials: false
      - name: Set up with the production composite
        uses: ./.github/actions/setup-mainline
      - name: Check the installed workspace
        run: |
          git diff --exit-code -- bun.lock
          vp check

  warm:
    needs: cold
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5
        with:
          persist-credentials: false
      - name: Set up with the production composite
        uses: ./.github/actions/setup-mainline
      - name: Check the installed workspace
        run: |
          git diff --exit-code -- bun.lock
          vp check

  macos:
    if: >-
      github.repository == 'monke-together-strong/monke-tools' &&
      github.ref == 'refs/heads/feature/measure-bun-package-cache-20261118'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5
        with:
          persist-credentials: false
      - name: Set up with the production composite
        uses: ./.github/actions/setup-mainline
      - name: Check the installed workspace
        run: |
          git diff --exit-code -- bun.lock
          vp check

  service:
    if: >-
      github.repository == 'monke-together-strong/monke-tools' &&
      github.ref == 'refs/heads/feature/measure-bun-package-cache-20261118'
    strategy:
      fail-fast: false
      matrix:
        failure: [unavailable, hard-failure]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5
        with:
          persist-credentials: false
      - name: Prepare an isolated cache fault
        run: |
          cat > "$RUNNER_TEMP/mock-bun-cache.cjs" <<'EOF'
          const entry = process.argv[1] ?? "";
          if (entry.includes("/_actions/actions/cache/")) {
            const mode = process.env.BUN_CACHE_REHEARSAL_FAILURE;
            console.log("Isolated cache fault injection: " + mode);
            if (mode === "hard-failure") {
              throw new Error("Injected cache action process failure");
            }
            process.env.ACTIONS_RESULTS_URL = "http://127.0.0.1:1/";
            process.env.ACTIONS_CACHE_URL = "http://127.0.0.1:1/";
          }
          EOF
      - name: Set up with the production composite and an unavailable cache
        uses: ./.github/actions/setup-mainline
        env:
          NODE_OPTIONS: --require=${{ runner.temp }}/mock-bun-cache.cjs
          BUN_CACHE_REHEARSAL_FAILURE: ${{ matrix.failure }}
      - name: Check the installed workspace
        run: |
          git diff --exit-code -- bun.lock
          vp check

  mismatch:
    needs: warm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v5
        with:
          persist-credentials: false
      - name: Change the manifest with the original lockfile
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          package = Path("package.json")
          manifest = json.loads(package.read_text())
          manifest["dependencies"]["yaml"] = "2.7.0"
          package.write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Try the production composite with the inconsistent manifest
        id: setup
        uses: ./.github/actions/setup-mainline
        continue-on-error: true

      - name: Require failure and an unchanged lockfile
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          test "$OUTCOME" = failure
          git diff --exit-code -- bun.lock
