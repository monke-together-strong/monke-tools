name: Qualify Mainline Guidance Cache

on:
  push:
    branches: [feature/measure-bun-package-cache-20261118]

permissions:
  contents: read

jobs:
  seed:
    uses: ./.github/workflows/measure-guidance-wiring.yml
    with:
      variant: cold

  replay:
    needs: seed
    strategy:
      fail-fast: false
      matrix:
        variant: [hit, repair, gated]
    uses: ./.github/workflows/measure-guidance-wiring.yml
    with:
      variant: ${{ matrix.variant }}
      expected-marker: ${{ needs.seed.outputs.marker }}
      select-release: ${{ matrix.variant == 'hit' }}
