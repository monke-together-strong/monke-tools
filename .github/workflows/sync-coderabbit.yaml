name: Sync CodeRabbit Standards

on:
  pull_request: {}
  push:
    branches: ["main"]

concurrency:
  group: sync-coderabbit-standards
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Detect And Validate
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.relevance.outputs.relevant }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: vp install --frozen-lockfile -- --prefer-offline

      - name: Detect relevant changes
        id: relevance
        env:
          AFTER_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          relevant="$(bun run scripts/generate-coderabbit-config.ts relevant \
            --before "$BEFORE_SHA" \
            --after "$AFTER_SHA")"
          printf 'relevant=%s\n' "$relevant" >> "$GITHUB_OUTPUT"

      - name: Generate configuration
        if: steps.relevance.outputs.relevant == 'true'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          install -d "$RUNNER_TEMP/coderabbit-generated"
          bun run scripts/generate-coderabbit-config.ts render \
            --source-commit "$SOURCE_SHA" \
            --output "$RUNNER_TEMP/coderabbit-generated/.coderabbit.yaml"

      - name: Install pinned CodeRabbit CLI
        if: steps.relevance.outputs.relevant == 'true'
        run: |
          install -d "$RUNNER_TEMP/coderabbit-cli"
          curl --fail --silent --show-error --location \
            https://cli.coderabbit.ai/releases/0.7.2/coderabbit-linux-x64.zip \
            --output "$RUNNER_TEMP/coderabbit-cli/coderabbit.zip"
          printf '%s  %s\n' \
            '32dd3a5a1238fa68eb7cfa95cc19cf6ad4980882589c616c0e300b920f1bb865' \
            "$RUNNER_TEMP/coderabbit-cli/coderabbit.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/coderabbit-cli/coderabbit.zip" \
            -d "$RUNNER_TEMP/coderabbit-cli"
          chmod 755 "$RUNNER_TEMP/coderabbit-cli/coderabbit"

      - name: Validate configuration
        if: steps.relevance.outputs.relevant == 'true'
        run: |
          "$RUNNER_TEMP/coderabbit-cli/coderabbit" config validate \
            "$RUNNER_TEMP/coderabbit-generated/.coderabbit.yaml"

      - name: Upload validated configuration
        if: steps.relevance.outputs.relevant == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coderabbit-configuration
          path: ${{ runner.temp }}/coderabbit-generated/.coderabbit.yaml
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  publish:
    name: Publish Central Configuration
    needs: prepare
    if: github.event_name == 'push' && needs.prepare.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    environment: coderabbit-sync

    steps:
      - name: Download validated configuration
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coderabbit-configuration
          path: ${{ runner.temp }}/coderabbit-generated

      - name: Create destination token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.CODERABBIT_SYNC_APP_ID }}
          private-key: ${{ secrets.CODERABBIT_SYNC_APP_PRIVATE_KEY }}
          owner: monke-together-strong
          repositories: coderabbit
          permission-contents: write

      - name: Checkout central configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: monke-together-strong/coderabbit
          ref: main
          path: coderabbit
          token: ${{ steps.app-token.outputs.token }}

      - name: Commit and push generated configuration
        working-directory: coderabbit
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cp "$RUNNER_TEMP/coderabbit-generated/.coderabbit.yaml" .coderabbit.yaml
          git add -- .coderabbit.yaml
          if git diff --cached --quiet; then
            echo "Central CodeRabbit configuration is already current."
            exit 0
          fi

          changed_paths="$(git diff --cached --name-only)"
          if [ "$changed_paths" != ".coderabbit.yaml" ]; then
            echo "Refusing to publish unexpected paths: $changed_paths" >&2
            exit 1
          fi

          git config user.name "$APP_SLUG[bot]"
          if bot_id="$(gh api "users/$APP_SLUG%5Bbot%5D" --jq .id)"; then
            git config user.email "$bot_id+$APP_SLUG[bot]@users.noreply.github.com"
          else
            echo "Could not resolve the bot user id; using a generic committer email." >&2
            git config user.email "$APP_SLUG[bot]@users.noreply.github.com"
          fi
          git commit -m "chore: sync team coding standards from monke-tools@${SOURCE_SHA:0:12}"
          git push origin HEAD:main
