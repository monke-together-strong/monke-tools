name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: Check And Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          cache: true

      - name: Install deps
        run: vp install --frozen-lockfile -- --prefer-offline

      - name: Check
        run: vp check

      - name: Restore locked guidance
        run: bun run src/index.ts skills restore --repo

      - name: Check packaged skill links
        run: vpr skills:check-links

      - name: Test
        run: >-
          vpr test
          --reporter=default
          --reporter=junit
          --outputFile.junit=junit-vitest.xml

  # TEMPORARY TRIAL: remove this whole job before any real merge.
  # Measures whether more than 2 test workers speeds up the Test step on this
  # runner. The worker count is overridden by a CLI flag only; vite.config.ts
  # keeps maxWorkers: 2. A new push cancels a running trial through the
  # workflow concurrency group, so push once and let all legs finish.
  trial-test-workers:
    name: TRIAL workers=${{ matrix.workers }} repeat=${{ matrix.repeat }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        workers: [2, 3, 4]
        repeat: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          cache: true

      - name: Install deps
        run: vp install --frozen-lockfile -- --prefer-offline

      - name: Restore locked guidance
        run: bun run src/index.ts skills restore --repo

      - name: Runner resources
        run: |
          nproc
          free -m

      - name: Test
        env:
          WORKERS: ${{ matrix.workers }}
          REPEAT: ${{ matrix.repeat }}
        run: |
          start=$(date +%s)
          status=0
          vpr test \
            --reporter=default \
            --reporter=junit \
            --outputFile.junit=junit-vitest.xml \
            --maxWorkers="$WORKERS" || status=$?
          wall=$(( $(date +%s) - start ))

          root=$(grep -m1 '<testsuites' junit-vitest.xml || true)
          attr() { echo "$root" | sed -n "s/.* $1=\"\([0-9]*\)\".*/\1/p"; }
          tests=$(attr tests)
          failures=$(attr failures)
          errors=$(attr errors)
          {
            echo "| workers | repeat | nproc | wall s | exit | tests | failures | errors |"
            echo "| --- | --- | --- | --- | --- | --- | --- | --- |"
            echo "| $WORKERS | $REPEAT | $(nproc) | $wall | $status | ${tests:-?} | ${failures:-?} | ${errors:-?} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "TRIAL workers=$WORKERS repeat=$REPEAT nproc=$(nproc) wall_s=$wall exit=$status tests=${tests:-?} failures=${failures:-?} errors=${errors:-?}"
          exit "$status"
